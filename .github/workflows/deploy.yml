name: Deploy SuperAgenda.Api a DonWeb

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SuperAgenda.Api/SuperAgenda.Api.csproj

      - name: Publish
        run: dotnet publish SuperAgenda.Api/SuperAgenda.Api.csproj -c Release -o publish

      - name: Deploy por FTPS a DonWeb
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DONWEB_FTP_SERVER }}
          username: ${{ secrets.DONWEB_FTP_USERNAME }}
          password: ${{ secrets.DONWEB_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./publish/
          server-dir: ${{ secrets.DONWEB_FTP_TARGET_DIR }}
